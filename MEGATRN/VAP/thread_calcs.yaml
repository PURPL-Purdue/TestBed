###################################################################################################
#                       VAP pintle tip thread calcs -- inputs                                     #
#                                                                                                 #
#   thread_calcs.py reads every number from here. No numbers live in the code.                    #
#   Run:  python MEGATRN/VAP/thread_calcs.py                (uses this file)                      #
#         python MEGATRN/VAP/thread_calcs.py other.yaml     (uses another file)                   #
#   Units in parentheses. [FILLER] = placeholder until CAD / test data is in.                     #
###################################################################################################

######################################
###### ENGINE / INJECTOR (from MEGATRN.set)
######################################

chamber_pressure: 200      # (psia) 
chamber_id: 4.2            # (in) 
lox_stiffness: 0.20        # (N/A) 
pintle_wall: 0.100         # (in)
diam_ratio: 0.2            # (N/A) 
mass_flow: 4.21            # (lbm/s) total
of_ratio: 1.0              # (N/A)

######################################
###### 1. SEPARATING FORCE
######################################

manifold_pressure: null    # (psia) null -> (1 + lox_stiffness) * chamber_pressure. Set reg/tank max for transients
atm_pressure: 14.7         # (psia)
effective_dia: null        # (in) dia pressure acts over. null -> pintle OD (conservative)

######################################
###### GEOMETRY [FILLER -- from CAD]
######################################

shaft_od: null             # (in) SS OD over the threads. null -> pintle OD
bore_min: 0.50             # (in) smallest bore we'll neck the Cu down to under the threads [FILLER]
grip_length: 0.25          # (in) clamped length, same for tip and shaft [FILLER]
shoulder_width: 0.050      # (in) shoulder radial width (half the wall)
min_wall: 0.030            # (in) thinnest Cu or SS wall we'll machine
wall_step: 0.005           # (in) step when growing the Cu wall

######################################
###### MATERIALS (room temp)
######################################

cu_yield: 10000            # (psi) annealed OFHC. 3.8-10 ksi depending on anneal/braze!
cu_ultimate: 32000         # (psi)
cu_modulus: 17.0e+6        # (psi)
ss_yield: 30000            # (psi) 316 annealed
ss_ultimate: 75000         # (psi)
ss_modulus: 28.0e+6        # (psi)
lox_density: 0.04353       # (lbm/in^3)

######################################
###### TEMPERATURES [FILLER -- until thermal model]
######################################

cu_temp: 70                # (F) copper tip at the joint
ss_temp: 70                # (F) SS shaft at the joint
cu_temp_sweep: [70, 200, 400, 600, 800]   # (F) sensitivity table

# Yield vs temperature, as fraction of room-temp yield. No credit taken for cold (clamped to 1 at 70 F).
# Cu: annealed OFCu, qedfusion.org/LIB/PROPS/PANOS/ofc.html Table 1 -> cubic fit
cu_yield_temps: [68, 80.6, 392, 620.6, 752, 932, 980.6, 1112, 1340.6, 1472]          # (F)
cu_yield_ratio: [1.0, 0.989, 0.769, 0.665, 0.615, 0.562, 0.546, 0.500, 0.381, 0.288]  # (N/A)
cu_yield_fit_order: 3
# SS: 316L plate, INL/CON-06-11962 Table 2, lowest of 4 heats -> linear interp (only 3 points)
ss_yield_temps: [70, 300, 600]           # (F)
ss_yield_ratio: [1.0, 0.618, 0.510]      # (N/A)

######################################
###### 3. PRELOAD LOSSES
######################################

embedding: 2.165e-4        # (in) VDI 2230 Rz<10um: 3 um thread + 2.5 um shoulder. Soft Cu may be worse
include_thermal: true      # LOx chill-down: Cu contracts more than SS -> preload drops. May not happen
cu_cold_contraction: 0.0029   # (N/A) dL/L 293 K -> ~90 K [FILLER -- check NIST]
ss_cold_contraction: 0.0027   # (N/A) dL/L 293 K -> ~90 K [FILLER -- check NIST]
relax_fraction: 0.25       # (N/A) fraction of preload lost to Cu creep hot [FILLER, no data]

######################################
###### TORQUE
######################################

friction_sweep: [0.10, 0.15, 0.20, 0.25]   # (N/A) threads + shoulder. Torque set at the highest

######################################
###### 4. THREADS
######################################

fos_target: 2.0            # (N/A)
thread_tables: [unf_threads.csv, unc_threads.csv]   # files next to the script: dia, TPI, name
